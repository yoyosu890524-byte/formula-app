<style>
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;margin:0;background:#f4f6f8;color:#222}

.ok{color:#17803d}.warn{color:#b26a00;font-weight:bold}.bad{color:#c62828;font-weight:bold}.demo{background:#fff3cd;color:#8a6d00;padding:1px 6px;border-radius:3px;font-size:12px}

.ge{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;margin:2px 0 6px 10px}.ge textarea{width:100%}.cite{margin-bottom:4px}.tb{display:inline-block;padding:0 6px;border-radius:3px;font-size:11px;color:#fff;margin-right:3px}.t1{background:#17803d}.t2{background:#1f5f8b}.t3{background:#7b4fa0}.t4{background:#888}.t5{background:#bbb}.gh{white-space:nowrap;background:#f7f7f7}.gh button{padding:0 3px;font-size:11px}.drag{cursor:grab}#gt td[contenteditable]{min-width:70px;max-width:260px}#gt td[contenteditable]:focus{outline:2px solid #1f5f8b;background:#eef6ff}.inv{background:#ffecec;outline:1px solid #e57373}</style></head><body>
<div id="login" class="card"></div>
<div id="appv" style="display:none">
<header><h1>保健食品配方設計 <span class="small" style="color:#cfe6f7">機密・加密儲存</span></h1>
<nav><button data-t="grid">後台表格編輯</button><button data-t="req">設計需求單</button><button data-t="ing">原料庫（後台）</button><button data-t="comp">競品比較</button><button data-t="saved">已存配方</button><button data-t="set">雲端同步/設定</button></nav>

<script>
const ITER=600000, enc=new TextEncoder(), dec=new TextDecoder();
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))), ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(pw,obj){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(pw,salt),enc.encode(JSON.stringify(obj)));
 return JSON.stringify({v:1,alg:'AES-256-GCM',kdf:'PBKDF2-SHA256',iter:ITER,salt:b64(salt),iv:b64(iv),ct:b64(ct)})}
async function decrypt(pw,s){const o=JSON.parse(s);const k=await key(pw,ub64(o.salt));
 return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},k,ub64(o.ct))))}
let PW=null,DB=null,CFG=null,TF=null,tab='grid',lastGen=[],sha=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
// ---------- login ----------
function loginView(){const has=localStorage.fv_blob;
 $('#login').innerHTML=has?`<h2>保健食品配方設計</h2><p>請輸入密碼解鎖本機加密資料。</p><input id=pw type=password style="width:100%" placeholder="密碼"><div class=row><button class=btn onclick="doLogin()">登入</button><span id=lm></span></div>
 <p class=small>忘記密碼無法復原資料（資料只以密碼加密）。</p><p class=small><a href="#" onclick="if(confirm('確定清除本機加密資料？雲端備份不受影響'))localStorage.clear(),location.reload()">清除本機資料，重新設定</a></p>`
 :`<h2>首次設定此裝置</h2><p><b>A. 第一台裝置：</b>設定新密碼（至少 10 碼），系統會載入<span class=demo>示範資料</span>。</p>
 <input id=pw type=password style="width:100%" placeholder="設定密碼"><input id=pw2 type=password style="width:100%;margin-top:6px" placeholder="再輸入一次"><div class=row><button class=btn onclick="doInit()">建立</button></div>
 <hr><p><b>B. 已在別台裝置使用：</b>輸入同一組密碼與 GitHub 權杖，從私人雲端庫下載。</p>
 <input id=rp type=password style="width:100%" placeholder="密碼"><input id=rr style="width:100%;margin-top:6px" value="yoyosu890524-byte/formula-vault" placeholder="私人儲存庫 owner/repo"><input id=rt type=password style="width:100%;margin-top:6px" placeholder="GitHub fine-grained 權杖">
 <div class=row><button class=btn onclick="doJoin()">從雲端下載並登入</button></div><span id=lm></span>`;
 $('#login').insertAdjacentHTML('beforeend',`<hr><p><b>試匯入預覽</b>（不需密碼）：先載入 Excel 檢視、編輯，不會保存；確認後再設定密碼保存。</p><button class=btn2 id=pvbtn onclick="startPreview()">試匯入預覽（不需密碼）</button>`);$('#pw')?.addEventListener('keydown',e=>e.key=='Enter'&&(has?doLogin():0))}
async function doInit(){const p=$('#pw').value;if(p.length<10)return alert('密碼至少 10 碼');if(p!==$('#pw2').value)return alert('兩次密碼不一致');
 PW=p;DB=structuredClone(window.DEMO);DB.updated=Date.now();CFG={};await saveLocal();start()}
async function doLogin(){$('#lm').textContent='解密中…';try{PW=$('#pw').value;DB=await decrypt(PW,localStorage.fv_blob);
 CFG=localStorage.fv_cfg?await decrypt(PW,localStorage.fv_cfg):{};await migrate();start();if(CFG.token)pull(true)}catch(e){PW=null;$('#lm').innerHTML='<span class=bad>密碼錯誤</span>'}}
async function doJoin(){PW=$('#rp').value;CFG={repo:$('#rr').value.trim(),token:$('#rt').value.trim()};$('#lm').textContent='下載中…';
 try{const r=await gh('GET');if(!r)throw'雲端尚無資料';DB=await decrypt(PW,r);await migrate();await saveLocal(false);start()}catch(e){PW=null;$('#lm').innerHTML='<span class=bad>失敗：'+esc(e.message||e)+'</span>'}}
function lock(){PW=DB=CFG=null;location.reload()}
async function start(){G=null;$('#login').style.display='none';$('#appv').style.display='';
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.activeElement?.blur?.();tab=b.dataset.t;if(tab=='grid'&&G&&!G.dirty)G=null;render()});render();
 try{const r=await fetch('/tfda-lookup/data.json');TF=await r.json();render()}catch(e){status('<span class=bad>TFDA 資料載入失敗</span>')}}
function status(h){$('#status').innerHTML=h}
// ---------- storage ----------
async function saveLocal(push=true){if(PREVIEW||!PW){status('<span class=warn>試匯入預覽：未保存</span>');return}DB.updated=Date.now();localStorage.fv_blob=await encrypt(PW,DB);localStorage.fv_cfg=await encrypt(PW,CFG);
 status('已加密儲存於本機 '+new Date().toLocaleTimeString('zh-TW'));if(push&&CFG.token)await pushCloud()}
async function gh(method,body){const u=`https://api.github.com/repos/${CFG.repo}/contents/vault.enc.json`;
 const h={Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json'};
 if(method=='GET'){const r=await fetch(u+'?t='+Date.now(),{headers:h,cache:'no-store'});if(r.status==404)return null;if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();sha=j.sha;return dec.decode(ub64(j.content.replace(/\n/g,'')))}
 const r=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify({message:'update vault',content:b64(enc.encode(body)),...(sha?{sha}:{})})});
 if(r.status==409||r.status==422)throw new Error('雲端版本較新，請先「從雲端下載」');if(!r.ok)throw new Error('GitHub '+r.status);sha=(await r.json()).content.sha}
async function pushCloud(){try{if(sha===null)await gh('GET');await gh('PUT',localStorage.fv_blob);status('已加密同步至雲端 '+new Date().toLocaleTimeString('zh-TW'))}catch(e){status('<span class=bad>雲端同步失敗：'+esc(e.message)+'</span>')}}
async function pull(auto){try{const s=await gh('GET');if(!s){if(!auto)alert('雲端尚無資料，將上傳本機資料');return pushCloud()}
 const d=await decrypt(PW,s);if(auto&&d.updated<=DB.updated){if(d.updated<DB.updated)pushCloud();return status('雲端已是最新')}
 DB=d;G=null;await migrate();await saveLocal(false);render();status('已從雲端載入最新版')}catch(e){status('<span class=bad>雲端讀取失敗：'+esc(e.message)+'</span>')}}
// ---------- TFDA ----------
function tfda(ing){if(!TF)return{lv:'',txt:'TFDA 資料載入中'};const q=(ing.tfdaName||ing.name||'').trim();if(!q)return{lv:'warn',txt:'未指定 TFDA 對照名稱'};
 const nm=s=>(s||'').split(/[；;、,，]/).map(x=>x.trim().toLowerCase());const ql=q.toLowerCase();
 let hits=TF.ingredients.filter(r=>nm(r[2]).includes(ql)||nm(r[3]).includes(ql)||(r[4]||'').toLowerCase()==ql).map(r=>({t:'原料',cat:r[0]+'／'+r[1],name:r[2],note:r[6]||''}));
 hits=hits.concat(TF.additives.filter(r=>nm(r[1]).includes(ql)||nm(r[2]).includes(ql)).map(r=>({t:'添加物',cat:r[0],name:r[1],note:r[3]||''})));
 if(!hits.length){const loose=TF.ingredients.filter(r=>(r[2]||'').includes(q)).slice(0,3).map(r=>r[2]);
  return{lv:'warn',txt:'TFDA 未列載'+(loose.length?'（相近：'+loose.join('、')+'）':'')+'，需另行確認',hits}}
 hits=hits.filter((h,i,a)=>a.findIndex(x=>x.name==h.name&&x.note==h.note)==i);const banned=hits.find(h=>/不得使用|尚不得/.test(h.cat));
 const lim=[];hits.forEach(h=>{let m;const re=/不得高於\s*([\d.]+)\s*(mg|g|μg|ug)/g;while(m=re.exec(h.note))lim.push({mg:+m[1]*({g:1000,mg:1,μg:.001,ug:.001}[m[2]]),src:h.name});
  const re2=/膠囊狀、錠狀食品；用量[^；。]*?為?([\d.]+)\s*g\/kg以下/g;while(m=re2.exec(h.note))lim.push({gkg:+m[1],src:h.name})});
 const qs=hits.some(h=>/適量使用/.test(h.note));
 return{lv:banned?'bad':'ok',txt:banned?'TFDA：'+banned.cat+'（不可使用）':'TFDA 已列載：'+hits.map(h=>h.t+'「'+h.name+'」').join('、')+(qs?'（可適量使用）':''),hits,lim}}
function tfdaCell(ing,dayActive,dayRaw,servRaw,servTotal){const t=tfda(ing);let h=`<span class=${t.lv}>${esc(t.txt)}</span>`;
 (t.lim||[]).forEach(l=>{if(l.mg!=null){const over=dayActive>l.mg;h+=`<br><span class=${over?'bad':'ok'}>每日上限 ${l.mg} mg（${esc(l.src)}）${over?'⚠ 超量':'✓'}</span>`}
  if(l.gkg!=null&&servTotal){const v=servRaw/servTotal*1000;h+=`<br><span class=${v>l.gkg?'bad':'ok'}>膠囊/錠上限 ${l.gkg} g/kg，本配方 ${v.toFixed(2)} g/kg ${v>l.gkg?'⚠ 超量':'✓'}</span>`}});
 const n=(t.hits||[]).map(x=>x.note).filter(Boolean).join('\n');if(n)h+=`<details><summary class=small>TFDA 備註/用量規定</summary><div class=small style="white-space:pre-wrap;max-width:420px">${esc(n.slice(0,1500))}</div></details>`;return h}
// ---------- citations ----------
function citeHtml(i){sortCites(i.cites);return i.cites?.length?evidence(i)+i.cites.map(c=>`<div class=cite><div class=small>${badge(c.type)} <a href="${esc(c.url)}" target=_blank>${esc(c.title)}</a> <i>${esc(c.journal)}</i>, ${esc(c.year)}${c.pmid?' PMID '+esc(c.pmid):''}</div>
 <div class=ge><div><b>組別與劑量</b><br>${esc(c.groups)||'<span class=warn>摘要未載明</span>'}</div><div><b>功效</b><br>${esc(c.effect)||'<span class=warn>待填（依摘要）</span>'}</div></div></div>`).join(''):'<span class=warn>尚無文獻</span>'}
async function abstractOf(pmid){const t=await (await fetch('https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&rettype=abstract&retmode=text&id='+pmid)).text();
 const p=t.split(/\n\n/).filter(x=>!/^(Author information|DOI|PMID|Copyright|©|Conflict)/.test(x.trim()));return p.sort((a,b)=>b.length-a.length)[0]?.replace(/\s+/g,' ')||''}
async function showAbs(n){const c=ED.cites[n];const el=$('#abs'+n);el.textContent='載入摘要中…';try{const a=c.pmid?await abstractOf(c.pmid):'';el.textContent=a.length>200?a:'（PubMed 無摘要）';
 if(a.length<=200&&!c.effect){sync();ED.cites[n].effect='摘要未載明';drawEd()}}catch(e){el.textContent='摘要載入失敗'}}
const TYPES=['臨床試驗','動物實驗','細胞實驗','文獻回顧','未分類'],TORD=t=>{const k=TYPES.indexOf(t);return k<0?4:k};
const TCLS={臨床試驗:'t1',動物實驗:'t2',細胞實驗:'t3',文獻回顧:'t4',未分類:'t5'};
const badge=t=>`<span class="tb ${TCLS[t]||'t5'}">${esc(t||'未分類')}</span>`;
function classify(pt,mh,txt){pt=new Set(pt);mh=new Set(mh);txt=(txt||'').toLowerCase();const any=(S,a)=>a.some(x=>S.has(x));
 if(any(pt,['Review','Systematic Review','Meta-Analysis']))return'文獻回顧';
 const hum=/participants|subjects|patients|volunteers|in humans|children|adults|women|men\b|randomi|placebo/.test(txt);
 if(any(pt,['Clinical Trial','Randomized Controlled Trial','Controlled Clinical Trial','Clinical Study','Clinical Trial, Phase II','Clinical Trial, Phase III']))return'臨床試驗';
 const viv=/in vivo|mice were|rats were|administered|fed |oral(ly)? |gavage|diet/.test(txt);
 if(!viv&&(any(mh,['Cell Line','In Vitro Techniques','Cells, Cultured'])||/cell line|in vitro|cultured cells|cells were|\d+(\.\d+)? cells/.test(txt)))return'細胞實驗';
 if(any(mh,['Mice','Rats'])||(mh.has('Animals')&&!mh.has('Humans'))||/\bmice\b|\brats?\b|in vivo|animal model/.test(txt)&&!hum)return'動物實驗';
 if(any(mh,['Cell Line','In Vitro Techniques','Cells, Cultured'])||/cell line|in vitro|cultured cells|cells were/.test(txt))return'細胞實驗';
 if(/meta-analysis|systematic review|\breview\b/.test(txt))return'文獻回顧';if(hum)return'臨床試驗';return'未分類'}
const sortCites=c=>(c||[]).sort((x,y)=>TORD(x.type)-TORD(y.type));
const EU='https://eutils.ncbi.nlm.nih.gov/entrez/eutils/';
async function fetchMeta(ids){if(!ids.length)return[];const x=new DOMParser().parseFromString(await (await fetch(EU+'efetch.fcgi?db=pubmed&retmode=xml&id='+ids.join(','))).text(),'text/xml');
 return [...x.querySelectorAll('PubmedArticle')].map(a=>{const T=s=>a.querySelector(s)?.textContent||'';const pm=T('MedlineCitation>PMID');
  const pt=[...a.querySelectorAll('PublicationType')].map(e=>e.textContent),mh=[...a.querySelectorAll('MeshHeading>DescriptorName')].map(e=>e.textContent);
  const ab=[...a.querySelectorAll('AbstractText')].map(e=>e.textContent).join(' '),title=T('ArticleTitle');
  return{pmid:pm,title,journal:T('Journal>Title'),year:(T('PubDate>Year')||T('PubDate>MedlineDate')).slice(0,4),url:'https://pubmed.ncbi.nlm.nih.gov/'+pm+'/',abstract:ab,type:classify(pt,mh,title+' '+ab)}})}
async function esearch(t,n){return (await (await fetch(EU+'esearch.fcgi?db=pubmed&retmode=json&sort=relevance&retmax='+n+'&term='+encodeURIComponent(t))).json()).esearchresult.idlist}
async function pubmed(q){const nr=' NOT (review[pt] OR systematic review[pt] OR meta-analysis[pt])';
 const tiers=[`(${q}) AND (clinical trial[pt] OR randomized controlled trial[pt] OR clinical study[pt]) AND humans[mh]`,`(${q}) AND (animals[mh] NOT humans[mh])${nr}`,`(${q}) AND (in vitro techniques[mh] OR cell line[mh] OR "in vitro"[tiab] OR cells[tiab])${nr}`];
 let ids=[];for(const t of tiers){for(const i of await esearch(t,4))if(!ids.includes(i))ids.push(i);await new Promise(r=>setTimeout(r,350))}
 if(!ids.length)ids=await esearch(`(${q}) AND (review[pt] OR systematic review[pt] OR meta-analysis[pt])`,5);
 return sortCites(await fetchMeta(ids))}
async function migrate(){let ch=false;DB.ingredients.forEach(i=>{const dm=i.demo&&window.DEMO.ingredients.find(x=>x.id==i.id);
  if(dm&&(DB.schema||1)<2){i.cites=structuredClone(dm.cites);i.rationale=dm.rationale;ch=true}
  (i.cites||[]).forEach(c=>{if(!c.type){c.type=classify([],[],c.title);ch=true}});sortCites(i.cites)});
 if((DB.schema||1)<2){DB.schema=2;ch=true}if(ch)await saveLocal()}
function evidence(i){const n={};(i.cites||[]).forEach(c=>n[c.type||'未分類']=(n[c.type||'未分類']||0)+1);const top=(i.cites||[])[0];
 return top?`<div class=small><b>證據等級：</b>${TYPES.filter(t=>n[t]).map(t=>t+' '+n[t]+' 篇').join('、')}；首要依據 PMID ${esc(top.pmid||'—')}（${esc(top.type||'未分類')}）</div>`:''}
// ---------- views ----------
function render(){if(G)flush();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 const hasDemo=DB.ingredients.some(i=>i.demo)||DB.competitors.some(c=>c.demo);
 $('#main').innerHTML=(PREVIEW?`<div class=banner style="background:#ffe0e0;border-color:#e57373"><b>試匯入預覽模式：資料不會保存到任何地方</b>（未加密、未存本機、未上傳；關閉或重新整理頁面就會消失）。<button class=btn onclick="pwDlg()">設定密碼並保存</button></div>`:'')+(hasDemo&&!PREVIEW?`<div class=banner>目前含有<span class=demo>示範資料</span>（非真實原料/競品，僅供測試）。匯入您的 Excel 後可於「原料庫」一鍵刪除示範資料。</div>`:'')+V[tab]()}
const FORMS={膠囊:{u:'顆',w:500,unit:'mg'},錠劑:{u:'錠',w:800,unit:'mg'},液劑:{u:'瓶',w:30,unit:'mL'},粉包:{u:'包',w:3,unit:'g'},果凍:{u:'條',w:15,unit:'g'},軟膠囊:{u:'顆',w:600,unit:'mg'}};
const V={};
V.req=()=>{const r=DB.lastReq||{form:'膠囊',w:500,unit:'mg',pack:'顆',per:1,day:2,claim:'護眼'};
 return `<div class=card><h3>設計需求單</h3><div class=row>劑型 <select id=f_form onchange="const f=FORMS[this.value];if(f){f_w.value=f.w;f_unit.value=f.unit;f_pack.value=f.u}">${Object.keys(FORMS).concat(['其他']).map(k=>`<option ${k==r.form?'selected':''}>${k}</option>`)}</select>
 每單位 <input id=f_w type=number value=${r.w} style="width:80px"><select id=f_unit>${['mg','g','mL'].map(u=>`<option ${u==r.unit?'selected':''}>${u}</option>`)}</select>
 ／<input id=f_pack value="${esc(r.pack)}" style="width:50px">（顆/包/條） 每份 <input id=f_per type=number value=${r.per} style="width:50px"> 單位，每日 <input id=f_day type=number value=${r.day} style="width:50px"> 份</div>
 <div class=row>訴求 <input id=f_claim value="${esc(r.claim)}" style="width:300px" placeholder="例：護眼、睡眠、關節"> <span class=small>可用逗號分隔多個訴求；比對原料庫的「訴求標籤」</span></div>

 const cl=r.claim.split(/[,，、\s]+/).filter(Boolean);
 const pick=DB.ingredients.filter(i=>!i.excipient&&cl.some(c=>(i.claims||'').includes(c)||c.includes(i.claims||'@@')));
 if(!pick.length){$('#out').innerHTML='<div class=card class=warn>原料庫沒有標記此訴求的原料，請到「原料庫」為原料加上訴求標籤。</div>';return}

 lastGen=[['方案A 入門劑量',0],['方案B 標準劑量',.5],['方案C 高劑量',1]].map(([nm,f])=>{
  const items=pick.map(i=>{const day=+(i.minDose+(i.maxDose-i.minDose)*f).toFixed(2);const conc=(+i.conc||100)/100;const serv=day/r.day;return{id:i.id,dayActive:day,servActive:serv,servRaw:serv/conc}});
  const sum=items.reduce((a,b)=>a+b.servRaw,0);if(exc&&sum<capServ)items.push({id:exc.id,dayActive:0,servActive:0,servRaw:capServ-sum,fill:true});

 const cols={};Object.keys(rows[0]).forEach(h=>{const k=mapCol(h);if(k&&!Object.values(cols).includes(k))cols[h]=k});let add=0,upd=0;
 rows.forEach(r=>{const o={};for(const[h,k]of Object.entries(cols))o[k]=r[h];if(!o.name&&!o.code)return;
  if(o.conc!==undefined&&o.conc!==''){let s=String(o.conc);let v=parseFloat(s.replace(/[^\d.]/g,''));if(!/%/.test(s)&&v<=1)v*=100;o.conc=v}
  ['minDose','maxDose'].forEach(k=>o[k]!==undefined&&(o[k]=parseFloat(o[k])||0));if(o.excipient!==undefined)o.excipient=/是|y|true|1/i.test(o.excipient);

function sv(i,k,v){v=String(v??'').trim();if(k=='excipient')i.excipient=/^(是|y|yes|true|1|v|✓)$/i.test(v);
 else if(NUMK.includes(k))i[k]=v===''?'':(isFinite(+v.replace(/%$/,''))?+v.replace(/%$/,''):v);else if(BASEK.includes(k))i[k]=v;else{i.extra=i.extra||{};i.extra[k]=v}}
function gridInit(){G={rows:structuredClone(DB.ingredients),cols:structuredClone(DB.cols||defCols()),undo:[],sel:new Set(),filter:'',dirty:false,sortK:null,sortD:1}}
function flush(){const ae=document.activeElement;if(ae?.matches?.('#gt td[data-k]')){cellCommit(ae);ae.dataset.k='';ae.blur()}}
function snap(){G.undo.push(JSON.stringify({rows:G.rows,cols:G.cols}));if(G.undo.length>50)G.undo.shift();G.dirty=true}
function undo(){flush();const s=G.undo.pop();if(!s)return;const o=JSON.parse(s);G.rows=o.rows;G.cols=o.cols;G.dirty=true;render()}
const vis=()=>G.cols.filter(c=>!c.hidden);
function shown(){const f=G.filter.trim().toLowerCase();return G.rows.filter(i=>!f||G.cols.some(c=>String(gv(i,c.key)??'').toLowerCase().includes(f)))}
function vErr(i,k,dups){const v=gv(i,k);
 if(k=='code'&&v&&dups.has(v))return'原料編號重複';if(k=='name'&&!v)return'缺原料名稱';
 if(NUMK.includes(k)&&v!==''&&v!=null&&(typeof v!='number'))return'需為數字';if(k=='conc'&&typeof v=='number'&&(v<0||v>100))return'濃度應介於 0–100%';
 if(k=='maxDose'&&typeof v=='number'&&typeof i.minDose=='number'&&v<i.minDose)return'最高劑量小於最低劑量';
 if(k=='tfdaName'&&v&&TF){const t=tfda(i);if(t.lv=='warn')return t.txt;if(t.lv=='bad')return t.txt}return''}
function dupSet(rows){const c={};rows.forEach(i=>i.code&&(c[i.code]=(c[i.code]||0)+1));return new Set(Object.keys(c).filter(k=>c[k]>1))}
V.grid=()=>{if(!G)gridInit();const cols=vis(),rows=shown(),d=dupSet(G.rows);let nErr=0;
 const body=rows.map((i,ri)=>`<tr draggable=true data-id="${i.id}"><td class=gh><input type=checkbox ${G.sel.has(i.id)?'checked':''} onchange="this.checked?G.sel.add('${i.id}'):G.sel.delete('${i.id}')"> <span class=drag title="拖曳排序">⠿</span><button onclick="mvRow('${i.id}',-1)">▲</button><button onclick="mvRow('${i.id}',1)">▼</button><button title=複製 onclick="dupRow('${i.id}')">⎘</button><button title=刪除 onclick="delRows(['${i.id}'])">✕</button>${i.demo?'<span class=demo>示範</span>':''}</td>
 ${cols.map((c,ci)=>{const e=vErr(i,c.key,d);if(e)nErr++;return `<td contenteditable data-ri=${ri} data-ci=${ci} data-k="${esc(c.key)}" class="${e?'inv':''}" title="${esc(e)}">${esc(gv(i,c.key))}</td>`}).join('')}</tr>`).join('');
 return `${PREVIEW?'':''}<div class=card><h3>後台表格編輯 ${G.dirty?'<span class=bad id=dirty>● 尚未儲存的變更</span>':'<span class=ok id=dirty>✓ 已儲存</span>'}</h3>
 <div class=row><button class=btn onclick="saveGrid()">${PREVIEW?'套用（預覽，不會保存）':'儲存'}</button><button class=btn2 onclick="undo()" ${G.undo.length?'':'disabled'}>↶ 復原 (${G.undo.length})</button>
 <button class=btn2 onclick="snap();G.rows.push(mkIng());render();moveTo(shown().length-1,0)">＋新增列</button><button class=btn2 onclick="delRows([...G.sel])">刪除勾選 (${G.sel.size})</button>
 <label class=btn2>匯入 Excel <input type=file accept=".xlsx,.xls,.csv" style="display:none" onchange="impStart(this.files[0])"></label><button class=btn2 onclick="exportXL()">匯出 .xlsx</button>
 <button class=btn2 onclick="colDlg()">欄位設定</button> 搜尋/篩選 <input id=gf value="${esc(G.filter)}" oninput="G.filter=this.value;clearTimeout(window._gf);window._gf=setTimeout(()=>{render();const e=$('#gf');e.focus();e.setSelectionRange(e.value.length,e.value.length)},250)" style="width:180px">
 <span class=small>顯示 ${rows.length}/${G.rows.length} 列；${nErr?`<span class=bad>${nErr} 個格子有問題（紅框，滑鼠移上看原因）</span>`:'<span class=ok>無驗證問題</span>'}</span></div>
 <p class=small>直接點格子編輯；Enter 下一列、Tab 下一欄、方向鍵移動；可從 Excel 複製多格後貼上（超出會自動新增列）；點欄名排序。</p>
 <div style="overflow:auto;max-height:70vh"><table id=gt><tr><th class=gh><input type=checkbox onchange="shown().forEach(i=>this.checked?G.sel.add(i.id):G.sel.delete(i.id));render()"></th>${cols.map(c=>`<th onclick="sortBy('${c.key}')" style="cursor:pointer">${esc(c.label)}${G.sortK==c.key?(G.sortD>0?' ▲':' ▼'):''}</th>`).join('')}</tr>${body}</table></div></div>`};
function sortBy(k){snap();G.sortD=G.sortK==k?-G.sortD:1;G.sortK=k;const d=G.sortD;G.rows.sort((a,b)=>{const x=gv(a,k)??'',y=gv(b,k)??'';return (typeof x=='number'&&typeof y=='number'?x-y:String(x).localeCompare(String(y),'zh-Hant',{numeric:true}))*d});render()}
function mvRow(id,dir){const k=G.rows.findIndex(r=>r.id==id),j=k+dir;if(j<0||j>=G.rows.length)return;snap();[G.rows[k],G.rows[j]]=[G.rows[j],G.rows[k]];G.sortK=null;render()}
function dupRow(id){snap();const k=G.rows.findIndex(r=>r.id==id);const c=structuredClone(G.rows[k]);c.id=uid();c.demo=false;c.code=c.code?c.code+'-複製':'';G.rows.splice(k+1,0,c);render()}
function delRows(ids){if(!ids.length)return alert('請先勾選');if(!confirm(`刪除 ${ids.length} 列？（可復原）`))return;snap();G.rows=G.rows.filter(r=>!ids.includes(r.id));ids.forEach(i=>G.sel.delete(i));render()}
function moveTo(ri,ci){const c=document.querySelector(`#gt td[data-ri="${ri}"][data-ci="${ci}"]`);if(!c)return;c.focus();const s=getSelection(),r=document.createRange();r.selectNodeContents(c);s.removeAllRanges();s.addRange(r)}
function cellCommit(td){const tr=td.closest('tr'),i=G.rows.find(r=>r.id==tr.dataset.id);if(!i)return;const k=td.dataset.k,old=String(gv(i,k)??''),nv=td.innerText.replace(/\n+$/,'');
 if(old===nv.trim())return;snap();sv(i,k,nv);G.sortK=null;refreshMarks()}
function refreshMarks(){const d=dupSet(G.rows);let n=0;document.querySelectorAll('#gt td[data-k]').forEach(td=>{const i=G.rows.find(r=>r.id==td.closest('tr').dataset.id);const e=vErr(i,td.dataset.k,d);if(e)n++;td.classList.toggle('inv',!!e);td.title=e});
 const dd=$('#dirty');if(dd){dd.className='bad';dd.textContent='● 尚未儲存的變更'}}
document.addEventListener('focusout',e=>{if(e.target.matches?.('#gt td[data-k]'))cellCommit(e.target)});
document.addEventListener('keydown',e=>{const td=e.target.closest?.('#gt td[data-k]');if(!td)return;const ri=+td.dataset.ri,ci=+td.dataset.ci;
 const at=()=>{const s=getSelection();if(!s.rangeCount)return[0,0];const r=s.getRangeAt(0);return[r.startOffset,r.endOffset,td.innerText.length]};
 if(e.key=='Enter'&&!e.shiftKey){e.preventDefault();td.blur();moveTo(ri+1,ci)}else if(e.key=='Tab'){e.preventDefault();td.blur();const n=vis().length;let r=ri,c=ci+(e.shiftKey?-1:1);if(c>=n){c=0;r++}if(c<0){c=n-1;r--}moveTo(r,c)}
 else if(e.key=='ArrowDown'){e.preventDefault();td.blur();moveTo(ri+1,ci)}else if(e.key=='ArrowUp'){e.preventDefault();td.blur();moveTo(ri-1,ci)}
 else if(e.key=='ArrowRight'||e.key=='ArrowLeft'){const[s,en,len]=at();const all=s==0&&en==len;if(all||(e.key=='ArrowRight'?en>=len:s<=0)){e.preventDefault();td.blur();moveTo(ri,ci+(e.key=='ArrowRight'?1:-1))}}
 else if(e.key=='Escape'){const i=G.rows.find(r=>r.id==td.closest('tr').dataset.id);td.innerText=gv(i,td.dataset.k)??'';td.blur()}
 else if((e.ctrlKey||e.metaKey)&&e.key=='z'){e.preventDefault();undo()}});
document.addEventListener('paste',e=>{const td=e.target.closest?.('#gt td[data-k]');if(!td)return;const t=e.clipboardData.getData('text/plain');if(!/[\t\n]/.test(t.replace(/\r?\n$/,'')))return;
 e.preventDefault();pasteTSV(+td.dataset.ri,+td.dataset.ci,t)});
function pasteTSV(ri,ci,t){flush();const m=t.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(l=>l.split('\t'));snap();const rows=shown(),cols=vis();
 m.forEach((line,dr)=>{let i=rows[ri+dr];if(!i){i=mkIng();G.rows.push(i);rows.push(i)}line.forEach((v,dc)=>{const c=cols[ci+dc];if(c)sv(i,c.key,v)})});G.sortK=null;render()}
let DRAG=null;document.addEventListener('dragstart',e=>{const tr=e.target.closest?.('#gt tr[data-id]');if(tr)DRAG=tr.dataset.id});
document.addEventListener('dragover',e=>{if(DRAG&&e.target.closest?.('#gt tr[data-id]'))e.preventDefault()});
document.addEventListener('drop',e=>{const tr=e.target.closest?.('#gt tr[data-id]');if(!DRAG||!tr)return;e.preventDefault();const a=G.rows.findIndex(r=>r.id==DRAG),b=G.rows.findIndex(r=>r.id==tr.dataset.id);DRAG=null;if(a<0||b<0||a==b)return;snap();const[x]=G.rows.splice(a,1);G.rows.splice(b,0,x);G.sortK=null;render()});
window.addEventListener('beforeunload',e=>{if(G?.dirty||PREVIEW&&G?.rows.length){e.preventDefault();e.returnValue=''}});
function colDlg(){dlg.innerHTML=`<h3>欄位設定</h3><table>${G.cols.map((c,n)=>`<tr><td><input type=checkbox ${c.hidden?'':'checked'} style="width:auto" onchange="snap();G.cols[${n}].hidden=!this.checked"> 顯示</td><td><input value="${esc(c.label)}" onchange="snap();G.cols[${n}].label=this.value"></td><td class=small>${BASEK.includes(c.key)?'系統欄位':'自訂欄位'}</td>
 <td><button onclick="mvCol(${n},-1)">▲</button><button onclick="mvCol(${n},1)">▼</button>${BASEK.includes(c.key)?'':`<button onclick="if(confirm('刪除此自訂欄與其資料？')){snap();G.cols.splice(${n},1);colDlg()}">✕</button>`}</td></tr>`).join('')}</table>
 <div class=row><input id=nc placeholder="新自訂欄名稱" style="width:200px"><button class=btn2 onclick="if(nc.value.trim()){snap();G.cols.push({key:'x_'+uid(),label:nc.value.trim(),hidden:false});colDlg()}">＋新增欄</button></div><div class=row><button class=btn onclick="dlg.close();render()">完成</button></div>`;if(!dlg.open)dlg.showModal()}
function mvCol(n,d){const j=n+d;if(j<0||j>=G.cols.length)return;snap();[G.cols[n],G.cols[j]]=[G.cols[j],G.cols[n]];colDlg()}
async function saveGrid(){document.activeElement?.blur?.();DB.ingredients=structuredClone(G.rows);DB.cols=structuredClone(G.cols);
 if(PREVIEW){G.dirty=false;render();status('<span class=warn>試匯入預覽：已套用，但尚未保存</span>');return}await saveLocal();G.dirty=false;render()}
function exportXL(){document.activeElement?.blur?.();const cols=vis();const aoa=[cols.map(c=>c.label)].concat(G.rows.map(i=>cols.map(c=>{const v=gv(i,c.key);return v??''})));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),'原料');XLSX.writeFile(wb,'原料庫_'+new Date().toLocaleDateString('sv')+'.xlsx')}
// ---- import with mapping preview + diff ----
async function impStart(f){if(!G)gridInit();const wb=XLSX.read(await f.arrayBuffer());const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false});
 const hdr=(aoa[0]||[]).map(String),data=aoa.slice(1).filter(r=>r.some(v=>String(v).trim()));const used=new Set();
 const map=hdr.map(h=>{const k=mapCol(h);if(k&&!used.has(k)){used.add(k);return k}const ex=G.cols.find(c=>!BASEK.includes(c.key)&&c.label==h);return ex?ex.key:(h.trim()?'new:'+h:'')});
 IMP={file:f.name,hdr,data,map};tab='imp';render()}
function impRows(){const o=IMP.data.map(r=>{const i=mkIng();IMP.map.forEach((k,n)=>{if(!k)return;const kk=k.startsWith('new:')?k:k;if(kk.startsWith('new:')){i.extra[kk]=String(r[n]??'').trim()}else{sv(i,kk,r[n]);if(kk=='conc'&&typeof i.conc=='number'&&i.conc<=1&&i.conc>0&&!/%/.test(r[n]))i.conc=+(i.conc*100).toFixed(4)}});return i});return o}
function impDiff(){const by={};G.rows.forEach(r=>r.code&&(by[r.code]=r));return impRows().map(n=>{const ex=n.code&&by[n.code];if(!ex)return{n,st:'新增'};
 const ch=IMP.map.filter(Boolean).filter(k=>!k.startsWith('new:')).filter(k=>String(gv(ex,k)??'')!==String(gv(n,k)??''));
 const chx=IMP.map.filter(k=>k&&k.startsWith('new:')).filter(k=>{const c=G.cols.find(c=>c.label==k.slice(4));return !c||String((ex.extra||{})[c.key]??'')!==String(n.extra[k]??'')});
 return{n,ex,st:ch.length||chx.length?'更新':'不變',ch:ch.concat(chx)}})}
V.imp=()=>{if(!IMP)return'<div class=card>請從「後台表格編輯」選擇檔案</div>';const opts=[['','（忽略此欄）'],...BASECOLS,...G.cols.filter(c=>!BASEK.includes(c.key)).map(c=>[c.key,'自訂：'+c.label])];
 const diff=impDiff(),cnt={新增:0,更新:0,不變:0};diff.forEach(d=>cnt[d.st]++);const d0=dupSet(diff.map(x=>x.n));
 return `<div class=card><h3>匯入預覽：${esc(IMP.file)}</h3><p>確認每一欄要對應到哪個欄位（下拉可修正），檢查每列差異後再按「確認匯入」。依「原料編號」比對：相同編號→更新，新編號→新增。</p>
 <div class=row><b>新增 ${cnt.新增}</b>・<b>更新 ${cnt.更新}</b>・不變 ${cnt.不變}<button class=btn onclick="impCommit()">確認匯入</button><button class=btn2 onclick="IMP=null;tab='grid';render()">取消</button></div>
 <div style="overflow:auto;max-height:70vh"><table><tr><th>狀態</th>${IMP.hdr.map((h,n)=>`<th>${esc(h)}<br><select onchange="IMP.map[${n}]=this.value;render()">${opts.map(([k,l])=>`<option value="${esc(k)}" ${IMP.map[n]==k?'selected':''}>${esc(l)}</option>`).join('')}<option value="new:${esc(h)}" ${IMP.map[n]=='new:'+h?'selected':''}>＋新增自訂欄「${esc(h)}」</option></select></th>`).join('')}</tr>
 ${diff.map((d,r)=>`<tr><td class=${d.st=='新增'?'ok':d.st=='更新'?'warn':'small'}>${d.st}${d.ch?.length?'<br><span class=small>'+d.ch.map(k=>esc(k.startsWith('new:')?k.slice(4):(BASECOLS.find(c=>c[0]==k)||[,k])[1])).join('、')+'</span>':''}</td>${IMP.data[r].map((v,n)=>{const k=IMP.map[n];const e=k&&!k.startsWith('new:')?vErr(d.n,k,d0):'';return `<td class="${e?'inv':''}" title="${esc(e)}">${esc(v)}</td>`}).join('')}</tr>`).join('')}</table></div></div>`};
function impCommit(){snap();IMP.map.forEach(k=>{if(k&&k.startsWith('new:')&&!G.cols.some(c=>c.label==k.slice(4)))G.cols.push({key:'x_'+uid(),label:k.slice(4),hidden:false})});
 const keyOf=k=>k.startsWith('new:')?G.cols.find(c=>c.label==k.slice(4)).key:k;
 impDiff().forEach(d=>{const n=d.n;const ex2={};Object.entries(n.extra).forEach(([k,v])=>ex2[keyOf(k)]=v);n.extra=ex2;
  if(d.st=='新增')G.rows.push(n);else if(d.st=='更新'){IMP.map.forEach(k=>{if(!k)return;const kk=keyOf(k);sv(d.ex,kk,gv(n,kk));});d.ex.demo=false}});
 IMP=null;tab='grid';render();status(PREVIEW?'<span class=warn>已匯入到預覽表格（尚未保存）</span>':'已匯入到表格，請按「儲存」')}
// ---- preview mode ----
function startPreview(){PREVIEW=true;PW=null;CFG={};DB={ingredients:[],competitors:[],formulas:[],schema:2,cols:defCols(),updated:Date.now()};tab='grid';start()}
function pwDlg(){dlg.innerHTML=`<h3>設定密碼並保存</h3><p>設定後，目前預覽中的資料（含您的編輯）會以此密碼加密並保存在本機${localStorage.fv_blob?'<br><b class=bad>注意：此裝置已有加密資料，將被取代</b>':''}。</p>
 <label>密碼（至少 10 碼）<input id=np1 type=password></label><label>再輸入一次<input id=np2 type=password></label><div class=row><button class=btn onclick="pwSave()">保存</button><button class=btn2 onclick="dlg.close()">取消</button></div>`;dlg.showModal()}
async function pwSave(){const p=np1.value;if(p.length<10)return alert('密碼至少 10 碼');if(p!==np2.value)return alert('兩次密碼不一致');
 document.activeElement?.blur?.();if(G){DB.ingredients=structuredClone(G.rows);DB.cols=structuredClone(G.cols)}PW=p;PREVIEW=false;dlg.close();await saveLocal(false);if(G)G.dirty=false;render();alert('已加密保存。之後請用此密碼登入。')}

loginView();
</script></body></html>
