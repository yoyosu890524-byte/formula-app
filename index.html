<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>保健食品配方設計</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="demo.js"></script>
<style>
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;margin:0;background:#f4f6f8;color:#222}
header{background:#1f5f8b;color:#fff;padding:10px 20px;display:flex;gap:16px;align-items:center}
header h1{font-size:18px;margin:0;flex:1}nav button{background:none;border:0;color:#cfe6f7;font-size:15px;padding:6px 10px;cursor:pointer}
nav button.on{color:#fff;border-bottom:2px solid #fff}main{padding:16px 24px;max-width:1400px;margin:auto}
.card{background:#fff;border-radius:8px;padding:14px 18px;margin-bottom:14px;box-shadow:0 1px 3px #0002}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #ddd;padding:5px 7px;text-align:left;vertical-align:top}th{background:#eef3f7}
input,select,textarea{font:inherit;padding:4px 6px;border:1px solid #bbb;border-radius:4px}button{font:inherit;cursor:pointer}
.btn{background:#1f5f8b;color:#fff;border:0;border-radius:4px;padding:6px 14px}.btn2{background:#fff;border:1px solid #1f5f8b;color:#1f5f8b;border-radius:4px;padding:5px 12px}
.ok{color:#17803d}.warn{color:#b26a00;font-weight:bold}.bad{color:#c62828;font-weight:bold}.demo{background:#fff3cd;color:#8a6d00;padding:1px 6px;border-radius:3px;font-size:12px}
.banner{background:#fff3cd;border:1px solid #e0c46c;padding:8px 12px;border-radius:6px;margin-bottom:12px}
#login{max-width:420px;margin:80px auto}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0}.small{font-size:12px;color:#666}
.opt{display:inline-block;vertical-align:top;width:32%;min-width:380px;margin-right:1%}#status{font-size:13px}
dialog{width:720px;max-width:95vw}dialog label{display:block;margin:6px 0}dialog input,dialog textarea{width:100%;box-sizing:border-box}
</style></head><body>
<div id="login" class="card"></div>
<div id="appv" style="display:none">
<header><h1>保健食品配方設計 <span class="small" style="color:#cfe6f7">機密・加密儲存</span></h1>
<nav><button data-t="req">設計需求單</button><button data-t="ing">原料庫（後台）</button><button data-t="comp">競品比較</button><button data-t="saved">已存配方</button><button data-t="set">雲端同步/設定</button></nav>
<span id="status"></span><button class="btn2" onclick="lock()">登出</button></header>
<main id="main"></main></div>
<dialog id="dlg"></dialog>
<script>
const ITER=600000, enc=new TextEncoder(), dec=new TextDecoder();
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))), ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encrypt(pw,obj){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(pw,salt),enc.encode(JSON.stringify(obj)));
 return JSON.stringify({v:1,alg:'AES-256-GCM',kdf:'PBKDF2-SHA256',iter:ITER,salt:b64(salt),iv:b64(iv),ct:b64(ct)})}
async function decrypt(pw,s){const o=JSON.parse(s);const k=await key(pw,ub64(o.salt));
 return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},k,ub64(o.ct))))}
let PW=null,DB=null,CFG=null,TF=null,tab='req',lastGen=[],sha=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
// ---------- login ----------
function loginView(){const has=localStorage.fv_blob;
 $('#login').innerHTML=has?`<h2>保健食品配方設計</h2><p>請輸入密碼解鎖本機加密資料。</p><input id=pw type=password style="width:100%" placeholder="密碼"><div class=row><button class=btn onclick="doLogin()">登入</button><span id=lm></span></div>
 <p class=small>忘記密碼無法復原資料（資料只以密碼加密）。</p><p class=small><a href="#" onclick="if(confirm('確定清除本機加密資料？雲端備份不受影響'))localStorage.clear(),location.reload()">清除本機資料，重新設定</a></p>`
 :`<h2>首次設定此裝置</h2><p><b>A. 第一台裝置：</b>設定新密碼（至少 10 碼），系統會載入<span class=demo>示範資料</span>。</p>
 <input id=pw type=password style="width:100%" placeholder="設定密碼"><input id=pw2 type=password style="width:100%;margin-top:6px" placeholder="再輸入一次"><div class=row><button class=btn onclick="doInit()">建立</button></div>
 <hr><p><b>B. 已在別台裝置使用：</b>輸入同一組密碼與 GitHub 權杖，從私人雲端庫下載。</p>
 <input id=rp type=password style="width:100%" placeholder="密碼"><input id=rr style="width:100%;margin-top:6px" value="yoyosu890524-byte/formula-vault" placeholder="私人儲存庫 owner/repo"><input id=rt type=password style="width:100%;margin-top:6px" placeholder="GitHub fine-grained 權杖">
 <div class=row><button class=btn onclick="doJoin()">從雲端下載並登入</button></div><span id=lm></span>`;
 $('#pw')?.addEventListener('keydown',e=>e.key=='Enter'&&(has?doLogin():0))}
async function doInit(){const p=$('#pw').value;if(p.length<10)return alert('密碼至少 10 碼');if(p!==$('#pw2').value)return alert('兩次密碼不一致');
 PW=p;DB=structuredClone(window.DEMO);DB.updated=Date.now();CFG={};await saveLocal();start()}
async function doLogin(){$('#lm').textContent='解密中…';try{PW=$('#pw').value;DB=await decrypt(PW,localStorage.fv_blob);
 CFG=localStorage.fv_cfg?await decrypt(PW,localStorage.fv_cfg):{};start();if(CFG.token)pull(true)}catch(e){PW=null;$('#lm').innerHTML='<span class=bad>密碼錯誤</span>'}}
async function doJoin(){PW=$('#rp').value;CFG={repo:$('#rr').value.trim(),token:$('#rt').value.trim()};$('#lm').textContent='下載中…';
 try{const r=await gh('GET');if(!r)throw'雲端尚無資料';DB=await decrypt(PW,r);await saveLocal(false);start()}catch(e){PW=null;$('#lm').innerHTML='<span class=bad>失敗：'+esc(e.message||e)+'</span>'}}
function lock(){PW=DB=CFG=null;location.reload()}
async function start(){$('#login').style.display='none';$('#appv').style.display='';
 document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});render();
 try{const r=await fetch('/tfda-lookup/data.json');TF=await r.json();render()}catch(e){status('<span class=bad>TFDA 資料載入失敗</span>')}}
function status(h){$('#status').innerHTML=h}
// ---------- storage ----------
async function saveLocal(push=true){DB.updated=Date.now();localStorage.fv_blob=await encrypt(PW,DB);localStorage.fv_cfg=await encrypt(PW,CFG);
 status('已加密儲存於本機 '+new Date().toLocaleTimeString('zh-TW'));if(push&&CFG.token)await pushCloud()}
async function gh(method,body){const u=`https://api.github.com/repos/${CFG.repo}/contents/vault.enc.json`;
 const h={Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json'};
 if(method=='GET'){const r=await fetch(u+'?t='+Date.now(),{headers:h,cache:'no-store'});if(r.status==404)return null;if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();sha=j.sha;return dec.decode(ub64(j.content.replace(/\n/g,'')))}
 const r=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify({message:'update vault',content:b64(enc.encode(body)),...(sha?{sha}:{})})});
 if(r.status==409||r.status==422)throw new Error('雲端版本較新，請先「從雲端下載」');if(!r.ok)throw new Error('GitHub '+r.status);sha=(await r.json()).content.sha}
async function pushCloud(){try{if(sha===null)await gh('GET');await gh('PUT',localStorage.fv_blob);status('已加密同步至雲端 '+new Date().toLocaleTimeString('zh-TW'))}catch(e){status('<span class=bad>雲端同步失敗：'+esc(e.message)+'</span>')}}
async function pull(auto){try{const s=await gh('GET');if(!s){if(!auto)alert('雲端尚無資料，將上傳本機資料');return pushCloud()}
 const d=await decrypt(PW,s);if(auto&&d.updated<=DB.updated){if(d.updated<DB.updated)pushCloud();return status('雲端已是最新')}
 DB=d;await saveLocal(false);render();status('已從雲端載入最新版')}catch(e){status('<span class=bad>雲端讀取失敗：'+esc(e.message)+'</span>')}}
// ---------- TFDA ----------
function tfda(ing){if(!TF)return{lv:'',txt:'TFDA 資料載入中'};const q=(ing.tfdaName||ing.name||'').trim();if(!q)return{lv:'warn',txt:'未指定 TFDA 對照名稱'};
 const nm=s=>(s||'').split(/[；;、,，]/).map(x=>x.trim().toLowerCase());const ql=q.toLowerCase();
 let hits=TF.ingredients.filter(r=>nm(r[2]).includes(ql)||nm(r[3]).includes(ql)||(r[4]||'').toLowerCase()==ql).map(r=>({t:'原料',cat:r[0]+'／'+r[1],name:r[2],note:r[6]||''}));
 hits=hits.concat(TF.additives.filter(r=>nm(r[1]).includes(ql)||nm(r[2]).includes(ql)).map(r=>({t:'添加物',cat:r[0],name:r[1],note:r[3]||''})));
 if(!hits.length){const loose=TF.ingredients.filter(r=>(r[2]||'').includes(q)).slice(0,3).map(r=>r[2]);
  return{lv:'warn',txt:'TFDA 未列載'+(loose.length?'（相近：'+loose.join('、')+'）':'')+'，需另行確認',hits}}
 hits=hits.filter((h,i,a)=>a.findIndex(x=>x.name==h.name&&x.note==h.note)==i);const banned=hits.find(h=>/不得使用|尚不得/.test(h.cat));
 const lim=[];hits.forEach(h=>{let m;const re=/不得高於\s*([\d.]+)\s*(mg|g|μg|ug)/g;while(m=re.exec(h.note))lim.push({mg:+m[1]*({g:1000,mg:1,μg:.001,ug:.001}[m[2]]),src:h.name});
  const re2=/膠囊狀、錠狀食品；用量[^；。]*?為?([\d.]+)\s*g\/kg以下/g;while(m=re2.exec(h.note))lim.push({gkg:+m[1],src:h.name})});
 const qs=hits.some(h=>/適量使用/.test(h.note));
 return{lv:banned?'bad':'ok',txt:banned?'TFDA：'+banned.cat+'（不可使用）':'TFDA 已列載：'+hits.map(h=>h.t+'「'+h.name+'」').join('、')+(qs?'（可適量使用）':''),hits,lim}}
function tfdaCell(ing,dayActive,dayRaw,servRaw,servTotal){const t=tfda(ing);let h=`<span class=${t.lv}>${esc(t.txt)}</span>`;
 (t.lim||[]).forEach(l=>{if(l.mg!=null){const over=dayActive>l.mg;h+=`<br><span class=${over?'bad':'ok'}>每日上限 ${l.mg} mg（${esc(l.src)}）${over?'⚠ 超量':'✓'}</span>`}
  if(l.gkg!=null&&servTotal){const v=servRaw/servTotal*1000;h+=`<br><span class=${v>l.gkg?'bad':'ok'}>膠囊/錠上限 ${l.gkg} g/kg，本配方 ${v.toFixed(2)} g/kg ${v>l.gkg?'⚠ 超量':'✓'}</span>`}});
 const n=(t.hits||[]).map(x=>x.note).filter(Boolean).join('\n');if(n)h+=`<details><summary class=small>TFDA 備註/用量規定</summary><div class=small style="white-space:pre-wrap;max-width:420px">${esc(n.slice(0,1500))}</div></details>`;return h}
// ---------- citations ----------
function citeHtml(i){return i.cites?.length?i.cites.map(c=>`<div class=small>• <a href="${esc(c.url)}" target=_blank>${esc(c.title)}</a> <i>${esc(c.journal)}</i>, ${esc(c.year)}${c.pmid?' PMID '+esc(c.pmid):''}</div>`).join(''):'<span class=warn>尚無文獻</span>'}
async function pubmed(q){const e='https://eutils.ncbi.nlm.nih.gov/entrez/eutils/';
 const s=await (await fetch(e+'esearch.fcgi?db=pubmed&retmode=json&retmax=5&sort=relevance&term='+encodeURIComponent(q))).json();const ids=s.esearchresult.idlist;if(!ids.length)return[];
 const r=(await (await fetch(e+'esummary.fcgi?db=pubmed&retmode=json&id='+ids.join(','))).json()).result;
 return ids.map(i=>({pmid:i,title:r[i].title,journal:r[i].fulljournalname,year:(r[i].pubdate||'').slice(0,4),url:'https://pubmed.ncbi.nlm.nih.gov/'+i+'/'}))}
// ---------- views ----------
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 const hasDemo=DB.ingredients.some(i=>i.demo)||DB.competitors.some(c=>c.demo);
 $('#main').innerHTML=(hasDemo?`<div class=banner>目前含有<span class=demo>示範資料</span>（非真實原料/競品，僅供測試）。匯入您的 Excel 後可於「原料庫」一鍵刪除示範資料。</div>`:'')+V[tab]()}
const FORMS={膠囊:{u:'顆',w:500,unit:'mg'},錠劑:{u:'錠',w:800,unit:'mg'},液劑:{u:'瓶',w:30,unit:'mL'},粉包:{u:'包',w:3,unit:'g'},果凍:{u:'條',w:15,unit:'g'},軟膠囊:{u:'顆',w:600,unit:'mg'}};
const V={};
V.req=()=>{const r=DB.lastReq||{form:'膠囊',w:500,unit:'mg',pack:'顆',per:1,day:2,claim:'護眼'};
 return `<div class=card><h3>設計需求單</h3><div class=row>劑型 <select id=f_form onchange="const f=FORMS[this.value];if(f){f_w.value=f.w;f_unit.value=f.unit;f_pack.value=f.u}">${Object.keys(FORMS).concat(['其他']).map(k=>`<option ${k==r.form?'selected':''}>${k}</option>`)}</select>
 每單位 <input id=f_w type=number value=${r.w} style="width:80px"><select id=f_unit>${['mg','g','mL'].map(u=>`<option ${u==r.unit?'selected':''}>${u}</option>`)}</select>
 ／<input id=f_pack value="${esc(r.pack)}" style="width:50px">（顆/包/條） 每份 <input id=f_per type=number value=${r.per} style="width:50px"> 單位，每日 <input id=f_day type=number value=${r.day} style="width:50px"> 份</div>
 <div class=row>訴求 <input id=f_claim value="${esc(r.claim)}" style="width:300px" placeholder="例：護眼、睡眠、關節"> <span class=small>可用逗號分隔多個訴求；比對原料庫的「訴求標籤」</span></div>
 <div class=row>參考競品 <select id=f_comp><option value="">（不比較）</option>${DB.competitors.map(c=>`<option value=${c.id} ${c.id==r.comp?'selected':''}>${esc(c.name)}</option>`)}</select>
 <button class=btn onclick="gen()">產生配方方案</button></div><p class=small>液劑以 1 mL ≈ 1 g 估算容量；活性含量 = 原料用量 × 活性成分濃度。</p></div><div id=out>${lastGen.length?outHtml():''}</div>`};
function gen(){const r={form:f_form.value,w:+f_w.value,unit:f_unit.value,pack:f_pack.value,per:+f_per.value||1,day:+f_day.value||1,claim:f_claim.value,comp:f_comp.value};DB.lastReq=r;
 const cl=r.claim.split(/[,，、\s]+/).filter(Boolean);
 const pick=DB.ingredients.filter(i=>!i.excipient&&cl.some(c=>(i.claims||'').includes(c)||c.includes(i.claims||'@@')));
 if(!pick.length){$('#out').innerHTML='<div class=card class=warn>原料庫沒有標記此訴求的原料，請到「原料庫」為原料加上訴求標籤。</div>';return}
 const capServ=r.w*({mg:1,g:1000,mL:1000}[r.unit])*r.per; // mg per serving
 const exc=DB.ingredients.find(i=>i.excipient);
 lastGen=[['方案A 入門劑量',0],['方案B 標準劑量',.5],['方案C 高劑量',1]].map(([nm,f])=>{
  const items=pick.map(i=>{const day=+(i.minDose+(i.maxDose-i.minDose)*f).toFixed(2);const conc=(+i.conc||100)/100;const serv=day/r.day;return{id:i.id,dayActive:day,servActive:serv,servRaw:serv/conc}});
  const sum=items.reduce((a,b)=>a+b.servRaw,0);if(exc&&sum<capServ)items.push({id:exc.id,dayActive:0,servActive:0,servRaw:capServ-sum,fill:true});
  return{id:uid(),name:nm,req:r,items,capServ,actSum:sum}});
 $('#out').innerHTML=outHtml()}
const ingById=id=>DB.ingredients.find(i=>i.id==id)||{name:'(已刪除原料)'};
function fmt(n){return n>=100?n.toFixed(0):n>=1?n.toFixed(1):n.toFixed(3)}
function outHtml(){const r=lastGen[0].req;const c=DB.competitors.find(x=>x.id==r.comp);
 return lastGen.map(F=>{const fit=F.actSum<=F.capServ;
 return `<div class=card><h3>${esc(F.name)} <span class=small>${esc(r.form)}，每${esc(r.pack)} ${r.w}${r.unit}，每份 ${r.per}${esc(r.pack)}，每日 ${r.day} 份</span></h3>
 <div class=${fit?'ok':'bad'}>劑型容量：每份可容納 ${fmt(F.capServ)} mg，活性原料合計 ${fmt(F.actSum)} mg（${(F.actSum/F.capServ*100).toFixed(0)}%）${fit?'✓ 可容納':'⚠ 超出容量，需增加每份顆數或降低劑量'}</div>
 <table><tr><th>原料</th><th>廠牌/編號</th><th>每份原料用量</th><th>每份活性含量</th><th>每日活性含量</th><th>TFDA 對照</th><th>設計理由與文獻</th></tr>
 ${F.items.map(it=>{const i=ingById(it.id);return `<tr><td>${esc(i.name)}${i.demo?' <span class=demo>示範</span>':''}${it.fill?' <span class=small>(補足重量)</span>':''}</td><td>${esc(i.brand)}<br><span class=small>${esc(i.code)}</span></td>
 <td>${fmt(it.servRaw)} mg</td><td>${it.fill?'—':fmt(it.servActive)+' mg '+esc(i.active)}</td><td>${it.fill?'—':fmt(it.dayActive)+' mg'}</td>
 <td>${tfdaCell(i,it.dayActive,it.servRaw,F.capServ)}</td><td>${esc(i.rationale)}${it.fill?'':citeHtml(i)}</td></tr>`}).join('')}</table>
 ${c?compTable([F],c):''}<div class=row><button class=btn2 onclick="saveF('${F.id}')">儲存此方案</button></div></div>`}).join('')}
async function saveF(id){const F=lastGen.find(f=>f.id==id);DB.formulas.push({...F,saved:Date.now()});await saveLocal();alert('已加密儲存')}
function compTable(Fs,...cs){const names=new Set();Fs.forEach(F=>F.items.filter(i=>!i.fill).forEach(i=>names.add(ingById(i.id).name)));cs.forEach(c=>c.items.forEach(i=>names.add(i.name)));
 return `<h4>與競品比較（每日活性/成分含量 mg）</h4><table><tr><th>成分</th>${Fs.map(F=>`<th>${esc(F.name)}</th>`).join('')}${cs.map(c=>`<th>${esc(c.name)}<br><a class=small href="${esc(c.url)}" target=_blank>來源</a></th>`).join('')}</tr>
 ${[...names].map(n=>{const fv=Fs.map(F=>{const it=F.items.find(i=>!i.fill&&ingById(i.id).name==n);return it?it.dayActive:null});const cv=cs.map(c=>{const it=c.items.find(i=>i.name==n);return it?+it.mg:null});
  return `<tr><td>${esc(n)}</td>${fv.map(v=>`<td>${v==null?'<span class=small>無</span>':fmt(v)}</td>`).join('')}${cv.map(v=>{const f=fv[0];const tag=v==null?'<span class=small>無</span>':fmt(v)+(f==null?' <span class=warn>（我方無）</span>':f>v?' <span class=ok>我方較高</span>':f<v?' <span class=warn>我方較低</span>':' 相同');return `<td>${tag}</td>`}).join('')}</tr>`}).join('')}</table>`}
V.ing=()=>`<div class=card><h3>原料庫（後台）</h3><div class=row><label class=btn2>匯入 Excel/CSV <input type=file id=xl accept=".xlsx,.xls,.csv" style="display:none" onchange="importXL(this.files[0])"></label>
 <button class=btn2 onclick="editIng()">＋新增原料</button><button class=btn2 onclick="delDemo()">刪除全部示範資料</button><span id=im class=small></span></div>
 <p class=small>Excel 欄位（名稱可彈性）：原料編號、原料名稱、廠牌、活性成分、活性成分濃度(%)、TFDA對照名稱、訴求、每日最低劑量(mg)、每日最高劑量(mg)、成本價、賦形劑(是/否)。依「原料編號」合併：相同編號更新、新編號新增。</p>
 <table><tr><th>編號</th><th>名稱</th><th>廠牌</th><th>活性成分/濃度</th><th>訴求</th><th>每日劑量(活性 mg)</th><th>成本價</th><th>TFDA</th><th>文獻</th><th></th></tr>
 ${DB.ingredients.map(i=>`<tr><td>${esc(i.code)}</td><td>${esc(i.name)}${i.demo?' <span class=demo>示範</span>':''}${i.excipient?' <span class=small>賦形劑</span>':''}</td><td>${esc(i.brand)}</td><td>${esc(i.active)} ${i.conc?i.conc+'%':''}</td><td>${esc(i.claims)}</td><td>${i.excipient?'—':i.minDose+'–'+i.maxDose}</td><td>${esc(i.cost)||'<span class=small>未填</span>'}</td>
 <td class=small>${tfdaCell(i,i.maxDose)}</td><td>${i.cites?.length||0} 篇</td><td><button class=btn2 onclick="editIng('${i.id}')">編輯</button> <button class=btn2 onclick="delIng('${i.id}')">刪除</button></td></tr>`).join('')}</table></div>`;
const MAP={code:['原料編號','編號','料號','品號','代號','id','code','ingredient id','sku'],name:['原料名稱','名稱','品名','原料','name','ingredient'],brand:['廠牌','品牌','供應商','廠商','brand','supplier','manufacturer'],
 active:['活性成分','有效成分','指標成分','active','active ingredient'],conc:['活性成分濃度','濃度','含量','活性濃度','有效成分含量','%','concentration','potency','純度'],tfdaName:['tfda對照名稱','tfda名稱','tfda'],
 claims:['訴求','功效','用途','claim','claims'],minDose:['每日最低劑量','最低劑量','min','min dose'],maxDose:['每日最高劑量','最高劑量','max','max dose'],cost:['成本價','成本','價格','單價','cost','price'],excipient:['賦形劑','excipient']};
function mapCol(h){h=String(h).toLowerCase().replace(/[（(][^)）]*[)）]/g,'').replace(/\s+/g,'');let best=null,bl=0;
 for(const[k,a]of Object.entries(MAP))for(const x of a){const xl=x.replace(/\s+/g,'');if(h==xl)return k;if(xl.length>1&&h.includes(xl)&&xl.length>bl){best=k;bl=xl.length}}return best}
async function importXL(f){const wb=XLSX.read(await f.arrayBuffer());const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});if(!rows.length)return;
 const cols={};Object.keys(rows[0]).forEach(h=>{const k=mapCol(h);if(k&&!Object.values(cols).includes(k))cols[h]=k});let add=0,upd=0;
 rows.forEach(r=>{const o={};for(const[h,k]of Object.entries(cols))o[k]=r[h];if(!o.name&&!o.code)return;
  if(o.conc!==undefined&&o.conc!==''){let s=String(o.conc);let v=parseFloat(s.replace(/[^\d.]/g,''));if(!/%/.test(s)&&v<=1)v*=100;o.conc=v}
  ['minDose','maxDose'].forEach(k=>o[k]!==undefined&&(o[k]=parseFloat(o[k])||0));if(o.excipient!==undefined)o.excipient=/是|y|true|1/i.test(o.excipient);
  const ex=o.code&&DB.ingredients.find(i=>i.code==o.code);if(ex){Object.assign(ex,o);ex.demo=false;upd++}else{DB.ingredients.push({id:uid(),code:'',name:'',brand:'',active:'',conc:100,tfdaName:'',claims:'',minDose:0,maxDose:0,cost:'',excipient:false,rationale:'',cites:[],...o});add++}});
 await saveLocal();render();$('#im').textContent=`匯入完成：新增 ${add}、更新 ${upd}。欄位對應：`+Object.entries(cols).map(([h,k])=>h+'→'+k).join('，')}
async function delIng(id){if(!confirm('刪除此原料？'))return;DB.ingredients=DB.ingredients.filter(i=>i.id!=id);await saveLocal();render()}
async function delDemo(){if(!confirm('刪除所有示範原料與示範競品？'))return;DB.ingredients=DB.ingredients.filter(i=>!i.demo);DB.competitors=DB.competitors.filter(c=>!c.demo);await saveLocal();render()}
let ED=null;
function editIng(id){ED=structuredClone(id?ingById(id):{id:uid(),code:'',name:'',brand:'',active:'',conc:100,tfdaName:'',claims:'',minDose:0,maxDose:0,cost:'',excipient:false,rationale:'',cites:[]});ED._new=!id;drawEd()}
function drawEd(){const i=ED,F=(k,l,t='text')=>`<label>${l}<input id=e_${k} type=${t} value="${esc(i[k])}"></label>`;
 dlg.innerHTML=`<h3>${i._new?'新增':'編輯'}原料</h3>${F('code','原料編號')}${F('name','原料名稱')}${F('brand','廠牌')}${F('active','活性成分')}${F('conc','活性成分濃度 (%)','number')}${F('tfdaName','TFDA 對照名稱（TFDA 上的中文/英文名）')}${F('claims','訴求標籤（逗號分隔）')}
 <div class=row>${F('minDose','每日最低劑量（活性 mg）','number')}${F('maxDose','每日最高劑量（活性 mg）','number')}</div>${F('cost','成本價（預留，例：NT$/kg）')}<label><input type=checkbox id=e_excipient ${i.excipient?'checked':''} style="width:auto"> 賦形劑（用於補足重量）</label>
 <label>設計理由<textarea id=e_rationale rows=3>${esc(i.rationale)}</textarea></label><b>文獻</b>
 ${i.cites.map((c,n)=>`<div class=row style="flex-wrap:nowrap"><input value="${esc(c.title)}" onchange="ED.cites[${n}].title=this.value" placeholder=篇名><input value="${esc(c.journal)}" onchange="ED.cites[${n}].journal=this.value" placeholder=期刊 style="width:140px"><input value="${esc(c.year)}" onchange="ED.cites[${n}].year=this.value" style="width:60px" placeholder=年><input value="${esc(c.url)}" onchange="ED.cites[${n}].url=this.value" placeholder=連結><button onclick="sync();ED.cites.splice(${n},1);drawEd()">✕</button></div>`).join('')||'<div class=warn>尚無文獻</div>'}
 <div class=row><button class=btn2 onclick="sync();ED.cites.push({title:'',journal:'',year:'',url:''});drawEd()">＋手動新增</button> PubMed 搜尋 <input id=pq style="width:260px" value="${esc(i.active||i.name)}"><button class=btn2 onclick="pmSearch()">搜尋</button></div><div id=pr></div>
 <div class=row><button class=btn onclick="saveIng()">儲存</button><button class=btn2 onclick="dlg.close()">取消</button></div>`;if(!dlg.open)dlg.showModal()}
function sync(){['code','name','brand','active','tfdaName','claims','cost','rationale'].forEach(k=>ED[k]=$('#e_'+k).value);['conc','minDose','maxDose'].forEach(k=>ED[k]=+$('#e_'+k).value);ED.excipient=$('#e_excipient').checked}
async function pmSearch(){$('#pr').textContent='搜尋 PubMed 中…';try{const r=await pubmed($('#pq').value);window._pm=r;
 $('#pr').innerHTML=r.length?r.map((c,n)=>`<div class=small><button onclick="sync();ED.cites.push(_pm[${n}]);drawEd()">加入</button> <a href="${c.url}" target=_blank>${esc(c.title)}</a> <i>${esc(c.journal)}</i> ${c.year}</div>`).join(''):'<span class=warn>PubMed 查無結果（尚無文獻）</span>'}catch(e){$('#pr').textContent='PubMed 連線失敗'}}
async function saveIng(){sync();const n=ED._new;delete ED._new;if(n)DB.ingredients.push(ED);else{const k=DB.ingredients.findIndex(i=>i.id==ED.id);ED.demo=false;DB.ingredients[k]=ED}dlg.close();await saveLocal();render()}
V.comp=()=>`<div class=card><h3>競品資料</h3><button class=btn2 onclick="editComp()">＋新增競品</button>
 <table style="margin-top:8px"><tr><th>產品</th><th>品牌</th><th>每日份量</th><th>成分（每日 mg）</th><th>來源</th><th></th></tr>${DB.competitors.map(c=>`<tr><td>${esc(c.name)}${c.demo?' <span class=demo>示範</span>':''}</td><td>${esc(c.brand)}</td><td>${esc(c.serving)}</td><td>${c.items.map(i=>esc(i.name)+' '+i.mg).join('<br>')}</td><td><a href="${esc(c.url)}" target=_blank>連結</a></td><td><button class=btn2 onclick="editComp('${c.id}')">編輯</button> <button class=btn2 onclick="delComp('${c.id}')">刪除</button></td></tr>`).join('')}</table></div>
 ${DB.formulas.length&&DB.competitors.length?`<div class=card>${compTable(DB.formulas.slice(-3),...DB.competitors)}<p class=small>比較對象：最近儲存的配方（最多 3 個）。「我方較高/較低」以第一欄配方為準。</p></div>`:'<div class=card class=small>儲存配方後，這裡會顯示配方與所有競品的並排比較。</div>'}`;
function editComp(id){const c=id?DB.competitors.find(x=>x.id==id):{id:uid(),name:'',brand:'',url:'',serving:'',items:[]};
 dlg.innerHTML=`<h3>競品</h3><label>產品名稱<input id=c_name value="${esc(c.name)}"></label><label>品牌<input id=c_brand value="${esc(c.brand)}"></label><label>來源網址<input id=c_url value="${esc(c.url)}"></label><label>每日份量說明<input id=c_serv value="${esc(c.serving)}"></label>
 <label>成分（每行一個：成分名稱, 每日 mg；名稱與原料庫相同才能對齊比較）<textarea id=c_items rows=6>${c.items.map(i=>i.name+', '+i.mg).join('\n')}</textarea></label>
 <div class=row><button class=btn id=c_save>儲存</button><button class=btn2 onclick="dlg.close()">取消</button></div>`;dlg.showModal();
 $('#c_save').onclick=async()=>{Object.assign(c,{name:c_name.value,brand:c_brand.value,url:c_url.value,serving:c_serv.value,demo:false,items:c_items.value.split('\n').map(l=>l.split(/[,，]/)).filter(a=>a[0].trim()).map(a=>({name:a[0].trim(),mg:parseFloat(a[1])||0}))});
  if(!id)DB.competitors.push(c);dlg.close();await saveLocal();render()}}
async function delComp(id){if(!confirm('刪除？'))return;DB.competitors=DB.competitors.filter(c=>c.id!=id);await saveLocal();render()}
V.saved=()=>`<div class=card><h3>已存配方</h3>${DB.formulas.length?`<table><tr><th>名稱</th><th>劑型</th><th>訴求</th><th>成分（每日活性 mg）</th><th>儲存時間</th><th></th></tr>${DB.formulas.map((F,n)=>`<tr><td>${esc(F.name)}</td><td>${esc(F.req.form)} ${F.req.w}${F.req.unit}/${esc(F.req.pack)}</td><td>${esc(F.req.claim)}</td><td>${F.items.filter(i=>!i.fill).map(i=>esc(ingById(i.id).name)+' '+fmt(i.dayActive)).join('<br>')}</td><td>${new Date(F.saved).toLocaleString('zh-TW')}</td><td><button class=btn2 onclick="lastGen=[DB.formulas[${n}]];tab='req';render()">開啟</button> <button class=btn2 onclick="DB.formulas.splice(${n},1);saveLocal().then(render)">刪除</button></td></tr>`).join('')}</table>`:'尚無'}</div>`;
V.set=()=>`<div class=card><h3>雲端同步（多裝置）</h3><p>資料以您的密碼在瀏覽器內加密（AES-256-GCM，PBKDF2 ${ITER.toLocaleString()} 次），只有密文會上傳到您的<b>私人</b> GitHub 儲存庫。權杖只以加密形式存在本機。</p>
 <label>私人儲存庫 <input id=s_repo value="${esc(CFG.repo||'yoyosu890524-byte/formula-vault')}" style="width:320px"></label><br><label>GitHub 權杖 <input id=s_tok type=password value="${esc(CFG.token||'')}" style="width:320px"></label>
 <div class=row><button class=btn onclick="CFG.repo=s_repo.value.trim();CFG.token=s_tok.value.trim();sha=null;saveLocal(false).then(()=>pull())">儲存設定並同步</button><button class=btn2 onclick="pull()">從雲端下載</button><button class=btn2 onclick="pushCloud()">上傳至雲端</button></div>
 <p class=small>狀態：${CFG.token?'已設定權杖':'<span class=warn>未設定（目前只存在本機）</span>'}　最後修改：${new Date(DB.updated).toLocaleString('zh-TW')}</p></div>
 <div class=card><h3>備份</h3><button class=btn2 onclick="const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([localStorage.fv_blob]));a.download='formula-vault.enc.json';a.click()">下載加密備份檔</button>
 <h3>更換密碼</h3><input id=np type=password placeholder="新密碼（至少 10 碼）"> <button class=btn2 onclick="if(np.value.length<10)return alert('至少 10 碼');PW=np.value;saveLocal().then(()=>alert('已更換；其他裝置請用新密碼重新設定'))">更換</button></div>`;
loginView();
